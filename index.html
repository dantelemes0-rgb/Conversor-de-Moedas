<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>DevClub - Convert Money</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js" defer></script>
</head>

<body>
    <div>
        <img src="./logo 1.png" alt="Logo DevClub" class="logo">
    </div>
    <main class="container">
        <label>
            converter <b>de</b>
            <select>
                <option> R$ real brasileiro</option>
            </select>
        </label>

        <label>
            converter <b>para</b>
            <select>
                <option>US$ Dólar americano</option>
                <option>€ Euro</option>
                <option>₿ Bitcoin</option>
                <option>£ Libra esterlina</option>
            </select>
        </label>

        <label>
            valor
            <input placeholder="Digite o valor">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="moeda">
                <img src="./brasil 2.png" alt="moeda a converter">
                <p class="moeda-nome">Real</p>
                <p class="moeda-valor">R$ 0,00</p>
            </div>

            <img class="arrow" src="./Vector.png" alt="seta">

            <div class="moeda">
                <img src="./estados-unidos (1) 1.png" alt="moeda convertida">
                <p class="moeda-nome"> Dólar americano</p>
                <p class="moeda-valor">US$ 0,00</p>
            </div>

        </section>
    </main>
</body>

</html>
